---
layout: page
---
<head>
  <style>
    body {
      margin: 0;
      padding: 20px 0 0 0;
    }

    .center-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .lock-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid gray;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
    }

    .lock-icon::before {
      content: "🔒";
      font-size: 24px;
    }

    .input-container {
      position: relative;
      display: inline-block;
      margin-bottom: 10px;
    }

    input {
      width: 280px;
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    input::placeholder {
      color: #ccc;
    }

    .arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: gray;
      cursor: pointer;
    }

    .info-text {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="center-container">
    <div class="lock-icon"></div>
    <div class="input-container">
      <input type="password" placeholder="password">
      <span class="arrow">➡</span>
    </div>
    email me at ejolu@live.com for access
  </div>
</body>
